<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gruppen-Manager</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--bd:#e3e6ea;--ac:#2563eb;--ac2:#1d4ed8;--bad:#dc2626;--ok:#16a34a;--c1:#3b82f6;--c2:#16a34a;--c3:#f59e0b}
@media(prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#181c22;--tx:#e8eaed;--mut:#9aa3ad;--bd:#2a3039;--ac:#3b82f6;--ac2:#60a5fa;--bad:#f87171;--ok:#4ade80}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:140px}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1}
main{max-width:980px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px}
button{font:inherit;border:0;border-radius:9px;padding:9px 13px;background:var(--ac);color:#fff;cursor:pointer;min-height:40px}
button:active{background:var(--ac2)}
button:disabled{opacity:.5}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.dng{background:var(--bad)}
button.sm{padding:4px 9px;min-height:30px;font-size:13px}
input,select,textarea{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx)}
textarea{min-height:80px;resize:vertical}
input[type=checkbox]{width:44px;height:26px;accent-color:var(--ac);flex:none}
label.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--bd)}
label.row:last-child{border:0}
label.row input:not([type=checkbox]),label.row select{width:150px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.subtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;-webkit-overflow-scrolling:touch}
.subtabs button{background:var(--card);color:var(--tx);border:1px solid var(--bd);white-space:nowrap;flex:none;border-radius:20px}
.subtabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.bnav{position:fixed;left:0;right:0;bottom:0;display:none;background:var(--card);border-top:1px solid var(--bd);z-index:8}
.bnav button{flex:1;background:transparent;color:var(--mut);border-radius:0;padding:6px 2px;min-height:56px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
.bnav button span{font-size:20px;line-height:1}
.bnav button.on{color:var(--ac);background:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:3px 4px 3px 11px;font-size:14px;word-break:break-all}
.chip button{padding:0;width:24px;height:24px;min-height:0;border-radius:50%;background:var(--bad);font-size:14px;line-height:1}
.add{display:flex;gap:8px}
.add button{flex:none}
.item{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--bd)}
.item.col{flex-direction:column;align-items:stretch}
.item:last-child{border:0}
.item .t{flex:1;min-width:0;word-break:break-word}
.item .t small{display:block;color:var(--mut)}
.mut{color:var(--mut)}
.badge{font-size:12px;border-radius:10px;padding:2px 8px;background:var(--bg);border:1px solid var(--bd);margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:24px}
.kpi span{color:var(--mut);font-size:13px}
.chart{display:flex;align-items:flex-end;gap:2px;height:110px;margin-top:8px}
.col{flex:1;display:flex;align-items:flex-end;gap:1px;height:100%}
.col i{flex:1;border-radius:2px 2px 0 0;display:block}
.clab{display:flex;gap:2px;font-size:10px;color:var(--mut);margin-top:3px}
.clab span{flex:1;text-align:center;white-space:nowrap;overflow:visible}
.legend{display:flex;gap:12px;font-size:12px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.grp{cursor:pointer}
.savebar{position:fixed;left:0;right:0;bottom:58px;background:var(--card);border-top:1px solid var(--bd);padding:8px 14px;display:flex;justify-content:center;z-index:7}
.savebar button{width:100%;max-width:400px}
#toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;max-width:90%;z-index:10}
#toast.show{opacity:1}
.login{max-width:360px;margin:8vh auto}
.err{color:var(--bad)}
.code{font-size:44px;font-weight:700;letter-spacing:8px;text-align:center;margin:6px 0}
hr{border:0;border-top:1px solid var(--bd);margin:16px 0}
.days{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.days label{display:flex;align-items:center;gap:3px;font-size:13px;border:1px solid var(--bd);border-radius:8px;padding:3px 7px}
.days input{width:auto;height:auto}
.mact{background:var(--bg);border-radius:10px;padding:10px;margin-top:6px}
.mact input{margin-bottom:8px}
@media(min-width:820px){.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.two .card{margin:0}}
</style>
</head>
<body>
<header><h1 id="title">🛡 Gruppen-Manager</h1><span id="hdr"></span></header>
<main id="app"></main>
<div id="savebar" class="savebar" style="display:none"><button data-act="save">💾 Speichern</button></div>
<nav id="bnav" class="bnav"></nav>
<div id="toast"></div>
<script>
const $ = (s, r) => (r || document).querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const app = $('#app');
let me = null, meta = null, groups = [], cur = null, tab = 'uebersicht', info = null, evTimer = null, memT = null, loginStop = false;
let mem = { q: '', sort: 'last', page: 0, data: null, open: null };
let ev = { items: [], f: 'all' };
const ROLE = { super: 'Owner', creator: 'Gruppen-Besitzer', admin: 'Admin' };

async function api(method, url, body) {
  const r = await fetch(url, {
    method, credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'dash' },
    body: body ? JSON.stringify(body) : undefined,
  });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && !url.includes('/login') && !url.includes('/tglogin')) { showLogin(); throw new Error('Nicht angemeldet'); }
  if (!r.ok) throw new Error(d.error || 'Fehler ' + r.status);
  return d;
}
let tt;
function toast(msg, isErr) {
  const t = $('#toast'); t.textContent = (isErr ? '❗ ' : '✅ ') + msg; t.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2800);
}
async function run(fn, okMsg) {
  try { const r = await fn(); if (okMsg) toast(okMsg); return r; } catch (e) { toast(e.message, true); }
}
const ago = (ts) => {
  if (!ts) return '–';
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 90) return 'gerade eben';
  if (s < 5400) return 'vor ' + Math.round(s / 60) + ' Min';
  if (s < 172800) return 'vor ' + Math.round(s / 3600) + ' Std';
  return 'vor ' + Math.round(s / 86400) + ' Tg';
};
const dt = (ts) => new Date(ts).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
const val = (id) => ($('#' + id) ? $('#' + id).value : '');
const chrome = (chatMode) => { $('#bnav').style.display = chatMode ? 'flex' : 'none'; $('#savebar').style.display = 'none'; };

/* ------------------------------ Login ------------------------------ */
async function showLogin() {
  clearInterval(evTimer); loginStop = true; chrome(false); cur = null;
  $('#hdr').innerHTML = '';
  let lm = { password: true, telegram: false };
  try { lm = await api('GET', '/api/loginmethods'); } catch (_) {}
  app.innerHTML = '<div class="card login"><h3>🔐 Anmelden</h3>' +
    (lm.telegram ? '<p class="mut" style="margin-top:0">Melde dich mit deinem Telegram-Account an. Du siehst nur Gruppen, in denen du Admin bist.</p><button id="tgl" style="width:100%">✈️ Mit Telegram anmelden</button><div id="tgbox"></div>' : '') +
    (lm.telegram && lm.password ? '<hr>' : '') +
    (lm.password ? '<input id="pw" type="password" placeholder="Owner-Passwort" autocomplete="current-password"><div class="btns"><button id="go" class="' + (lm.telegram ? 'sec' : '') + '" style="width:100%">Mit Passwort anmelden</button></div>' : '') +
    '<p class="err" id="lerr"></p></div>';
  if (lm.password) {
    const go = async () => {
      try { await api('POST', '/api/login', { password: $('#pw').value }); await init(); }
      catch (e) { $('#lerr').textContent = e.message; }
    };
    $('#go').onclick = go;
    $('#pw').onkeydown = (e) => { if (e.key === 'Enter') go(); };
  }
  if (lm.telegram) $('#tgl').onclick = tgLogin;
}
async function tgLogin() {
  $('#lerr').textContent = '';
  let r;
  try { r = await api('POST', '/api/tglogin/start'); } catch (e) { $('#lerr').textContent = e.message; return; }
  loginStop = false;
  $('#tgbox').innerHTML = '<p>1. Öffne den Bot in Telegram:</p><a href="' + esc(r.link) + '" target="_blank" rel="noopener"><button type="button" style="width:100%">✈️ Bot öffnen</button></a>' +
    '<p>2. Tippe dort diese Zahl:</p><div class="code">' + esc(r.code) + '</div><p class="mut" id="tgstat">Warte auf Bestätigung …</p>' +
    '<button class="sec sm" type="button" id="tgcancel">Abbrechen</button>';
  $('#tgcancel').onclick = () => { loginStop = true; $('#tgbox').innerHTML = ''; };
  for (let i = 0; i < 150 && !loginStop; i++) {
    await sleep(2000);
    if (loginStop) return;
    const s = await api('GET', '/api/tglogin/poll?poll=' + r.poll).catch(() => null);
    if (!s) continue;
    if (s.status === 'ok') { loginStop = true; await init(); return; }
    if (s.status === 'denied') { if ($('#tgstat')) $('#tgstat').textContent = '❌ Abgebrochen oder falsche Zahl. Bitte neu starten.'; return; }
    if (s.status === 'expired') { if ($('#tgstat')) $('#tgstat').textContent = '⌛ Abgelaufen. Bitte neu starten.'; return; }
    if (s.claimed && $('#tgstat')) $('#tgstat').textContent = 'Im Bot bestätigen … (Zahl antippen)';
  }
}
async function init() {
  try {
    meta = await api('GET', '/api/meta');
    me = await api('GET', '/api/me');
    $('#title').textContent = '🛡 @' + meta.bot;
    $('#hdr').innerHTML = '<span class="badge">' + esc(me.name || 'Owner') + (me.sup ? ' · Owner' : '') + '</span> <button class="sec sm" data-act="logout">Abmelden</button>';
    await showHome();
  } catch (e) { if (e.message !== 'Nicht angemeldet') showLogin(); }
}

/* ------------------------------ Startseite ------------------------------ */
const fmtUp = (s) => Math.floor(s / 3600) + 'h ' + Math.floor((s % 3600) / 60) + 'm';
async function showHome() {
  clearInterval(evTimer); cur = null; chrome(false);
  const o = await api('GET', '/api/overview');
  groups = o.chats;
  const sup = me && me.sup;
  const gb = sup ? await api('GET', '/api/gbans').catch(() => ({ items: [] })) : { items: [] };
  const bk = sup ? await api('GET', '/api/backups').catch(() => ({ items: [] })) : { items: [] };
  const ss = sup ? await api('GET', '/api/sessions').catch(() => ({ items: [] })) : { items: [] };
  let h = '<div class="grid"><div class="kpi"><b>' + o.chats.length + '</b><span>' + (sup ? 'Gruppen' : 'Deine Gruppen') + '</span></div>' +
    (sup ? '<div class="kpi"><b>' + fmtUp(o.uptime) + '</b><span>Laufzeit</span></div><div class="kpi"><b>' + o.rss + ' MB</b><span>RAM</span></div>' : '') + '</div>' +
    '<div class="card"><h3>Gruppen</h3>' + (o.chats.length ? o.chats.map((c) =>
      '<div class="item grp" data-act="open" data-v="' + esc(c.id) + '"><div class="t"><b>' + esc(c.title) + '</b>' +
      (c.locked ? '<span class="badge">🔒</span>' : '') + (c.raid ? '<span class="badge">🚨</span>' : '') +
      '<small>' + c.msgs + ' Nachrichten heute · ' + c.members + ' bekannte Mitglieder</small></div><span>›</span></div>').join('')
      : (sup ? '<p class="mut">Noch keine Gruppen. Füge den Bot einer Supergruppe hinzu, mach ihn zum Admin und sende dort /setup.</p>'
        : '<p class="mut">Keine Gruppen gefunden. Du siehst hier nur Gruppen, in denen du <b>Admin</b> bist und in denen der Bot aktiv ist (dort muss der Bot mindestens einmal eine Nachricht gesehen haben).</p>')) + '</div>';
  if (sup) {
    h += '<div class="card"><h3>📣 Rundnachricht an alle Gruppen</h3><textarea id="bc" placeholder="Text …"></textarea>' +
      '<div class="btns"><button data-act="broadcast">Senden</button><a href="/api/backup"><button class="sec" type="button">💾 Backup (data.json)</button></a></div></div>' +
      '<div class="card"><h3>🌍 Globale Bann-Liste</h3><p class="mut" style="margin:0 0 8px">Bannt den User in allen Gruppen und sofort beim Beitritt zu neuen.</p>' +
      (gb.items.length ? gb.items.map((g) => '<div class="item"><div class="t"><b>' + esc(g.id) + '</b><small>' + dt(g.t) + (g.reason ? ' · ' + esc(g.reason) : '') + '</small></div><button class="sm sec" data-act="ungban" data-v="' + esc(g.id) + '">Aufheben</button></div>').join('') : '<p class="mut">Liste leer.</p>') +
      '<input id="gb-id" inputmode="numeric" placeholder="User-ID (Zahl)" style="margin-top:8px"><input id="gb-reason" placeholder="Grund (optional)" style="margin-top:6px"><div class="btns"><button class="dng" data-act="gban">🌍 Global bannen</button></div></div>' +
      '<div class="card"><h3>🗄 Automatische Backups</h3><p class="mut" style="margin:0 0 8px">Täglich ein Stand, die letzten 7 Tage (Ordner <code>backups/</code>).</p>' +
      (bk.items.length ? bk.items.map((f) => '<div class="item"><div class="t">' + esc(f.name) + '<small>' + Math.round(f.size / 1024) + ' KB</small></div><a href="/api/backups/' + esc(f.name) + '"><button class="sm sec" type="button">⬇️</button></a><button class="sm sec" data-act="restore" data-v="' + esc(f.name) + '">♻️ Wiederherstellen</button></div>').join('') : '<p class="mut">Noch keine – das erste Backup entsteht kurz nach dem Start.</p>') + '</div>' +
      '<div class="card"><h3>🔑 Angemeldete Web-Sitzungen</h3>' + (ss.items.length ? ss.items.map((x) =>
        '<div class="item"><div class="t"><b>' + esc(x.name || 'Owner') + '</b>' + (x.username ? ' <span class="mut">@' + esc(x.username) + '</span>' : '') + (x.sup ? '<span class="badge">Owner</span>' : '') + (x.current ? '<span class="badge">du</span>' : '') +
        '<small>' + (x.uid ? 'ID ' + esc(x.uid) + ' · ' : '') + esc(x.ip) + ' · seit ' + dt(x.since) + '</small></div><button class="sm sec" data-act="revoke" data-v="' + esc(x.id) + '">Abmelden</button></div>').join('') : '<p class="mut">Keine.</p>') + '</div>';
  }
  app.innerHTML = h;
}

/* ------------------------------ Navigation ------------------------------ */
const NAV = [
  { id: 'home', icon: '📊', label: 'Übersicht', tabs: [['uebersicht', 'Dashboard'], ['log', 'Log']] },
  { id: 'protect', icon: '🛡', label: 'Schutz', tabs: [['regeln', 'Regeln'], ['beitritt', 'Beitritt'], ['strafen', 'Strafen'], ['listen', 'Listen'], ['sperren', 'Sperren']] },
  { id: 'content', icon: '💬', label: 'Inhalte', tabs: [['willkommen', 'Willkommen'], ['auto', 'Automatik']] },
  { id: 'people', icon: '👥', label: 'Mitglieder', tabs: [['mitglieder', 'Liste']] },
  { id: 'more', icon: '⚙️', label: 'Mehr', tabs: [['nacht', 'Nachtmodus'], ['bericht', 'Berichte'], ['settings', 'Einstellungen']] },
];
const catOf = (t) => NAV.find((c) => c.tabs.some((x) => x[0] === t)) || NAV[0];
const SAVE_TABS = ['regeln', 'beitritt', 'strafen', 'willkommen', 'nacht', 'bericht', 'settings'];

async function openChat(id) {
  cur = await api('GET', '/api/chat/' + id);
  if (!groups.length) groups = (await api('GET', '/api/overview')).chats;
  info = null; mem = { q: '', sort: 'last', page: 0, data: null, open: null }; ev = { items: [], f: 'all' };
  tab = 'uebersicht';
  renderChat();
}
function renderChat() {
  clearInterval(evTimer);
  const cat = catOf(tab);
  chrome(true);
  $('#bnav').innerHTML = NAV.map((c) => '<button data-act="cat" data-v="' + c.id + '" class="' + (c.id === cat.id ? 'on' : '') + '"><span>' + c.icon + '</span>' + c.label + '</button>').join('');
  app.innerHTML =
    '<div class="add" style="margin-bottom:8px"><button class="sec" data-act="home">←</button><select id="gsel">' +
    groups.map((g) => '<option value="' + esc(g.id) + '"' + (g.id === cur.id ? ' selected' : '') + '>' + esc(g.title) + '</option>').join('') + '</select></div>' +
    '<p class="mut" style="margin:0 0 8px;font-size:13px">' + esc(ROLE[cur.role] || '') + (cur.locked ? ' · <b>🔒 gesperrt</b>' : '') + (cur.raid ? ' · <b>🚨 Raid-Schutz aktiv</b>' : '') + '</p>' +
    (cat.tabs.length > 1 ? '<div class="subtabs">' + cat.tabs.map(([k, l]) => '<button data-act="tab" data-v="' + k + '" class="' + (k === tab ? 'on' : '') + '">' + l + '</button>').join('') + '</div>' : '') +
    '<div id="pane">' + pane() + '</div>';
  $('#savebar').style.display = SAVE_TABS.includes(tab) ? 'flex' : 'none';
  afterRender();
}
function pane() {
  return ({ uebersicht: pUeber, log: pLog, regeln: pRegeln, beitritt: pBeitritt, strafen: pStrafen, listen: pListen, sperren: pSperren,
    willkommen: pWillkommen, auto: pAuto, mitglieder: pMitglieder, nacht: pNacht, bericht: pBericht, settings: pSettings })[tab]();
}
function afterRender() {
  if (tab === 'uebersicht' || tab === 'settings') { loadInfo(); loadRights(); }
  if (tab === 'mitglieder') loadMembers();
  if (tab === 'log') { loadEvents(); evTimer = setInterval(loadEvents, 10000); }
}
async function loadInfo() {
  info = await run(() => api('GET', '/api/chat/' + cur.id + '/info'));
  if (!info) return;
  if ($('#memcnt')) $('#memcnt').textContent = info.members == null ? '–' : info.members;
  if ($('#admins')) $('#admins').innerHTML = info.admins.filter((a) => !a.bot).map((a) =>
    '<div class="item"><div class="t"><b>' + esc(a.name) + '</b>' + (a.user ? ' <span class="mut">@' + esc(a.user) + '</span>' : '') +
    '<small>ID ' + a.id + ' · ' + (a.status === 'creator' ? 'Besitzer' : 'Admin') + (a.title ? ' · ' + esc(a.title) : '') + '</small></div></div>').join('') || '<p class="mut">–</p>';
}
async function loadRights() {
  const r = await run(() => api('GET', '/api/chat/' + cur.id + '/rights'));
  const el = $('#rights'); if (!el || !r) return;
  const o = (v) => (v ? '✅' : '❌');
  el.innerHTML = !r.member ? '❌ Bot ist nicht (mehr) in dieser Gruppe.' : !r.admin ? '❌ Bot ist kein Admin.' :
    o(r.del) + ' Nachrichten löschen<br>' + o(r.restrict) + ' Mitglieder sperren/bannen<br>' + o(r.pin) + ' Anheften';
}

/* ---------------------------- Bausteine ---------------------------- */
const ACTS = [['delete', 'Nur löschen'], ['warn', 'Verwarnen'], ['mute', 'Stummschalten'], ['kick', 'Kicken'], ['ban', 'Bannen']];
const sw = (k, l) => '<label class="row"><span>' + esc(l) + '</span><input type="checkbox" data-f="' + k + '"' + (cur.settings[k] ? ' checked' : '') + '></label>';
const num = (k, l, min, max, v) => '<label class="row"><span>' + esc(l) + '</span><input type="number" data-f="' + k + '" min="' + min + '" max="' + max + '" value="' + (v !== undefined ? v : cur.settings[k]) + '"></label>';
const actSel = (kind) => '<label class="row"><span>Aktion</span><select data-f="act.' + kind + '">' + ACTS.map(([v, l]) =>
  '<option value="' + v + '"' + (cur.acts[kind] === v ? ' selected' : '') + '>' + l + '</option>').join('') + '</select></label>';
const box = (title, desc, body) => '<div class="card"><h3>' + title + '</h3>' + (desc ? '<p class="mut" style="margin:0 0 6px">' + desc + '</p>' : '') + body + '</div>';
const chips = (list, act) => '<div class="chips">' + (list.length ? list.map((x) =>
  '<span class="chip">' + esc(x) + '<button data-act="' + act + '" data-v="' + esc(x) + '">×</button></span>').join('') : '<span class="mut">leer</span>') + '</div>';
const addRow = (id, ph, act) => '<div class="add"><input id="' + id + '" placeholder="' + esc(ph) + '"><button data-act="' + act + '">＋</button></div>';

function chart(series, labels) {
  const max = Math.max(1, ...series.flatMap((s) => s.vals));
  const cols = labels.map((l, i) => '<div class="col" title="' + esc(l) + ': ' + series.map((s) => s.vals[i]).join(' / ') + '">' +
    series.map((s) => '<i style="height:' + Math.max(1, Math.round(s.vals[i] / max * 100)) + '%;background:' + s.color + '"></i>').join('') + '</div>').join('');
  const step = Math.ceil(labels.length / 6);
  return '<div class="chart">' + cols + '</div><div class="clab">' + labels.map((l, i) => '<span>' + (i % step === 0 ? esc(l) : '') + '</span>').join('') + '</div>' +
    (series.length > 1 ? '<div class="legend">' + series.map((s) => '<span><i style="background:' + s.color + '"></i>' + esc(s.name) + '</span>').join('') + '</div>' : '');
}

/* ---------------------------- Aktionen ---------------------------- */
function collect() {
  const body = {};
  document.querySelectorAll('#pane [data-f]').forEach((el) => {
    const v = el.type === 'checkbox' ? el.checked : el.type === 'number' ? (el.value === '' ? undefined : Number(el.value)) : el.value;
    if (v === undefined) return;
    const p = el.dataset.f.split('.');
    if (p.length === 2) { body[p[0]] = body[p[0]] || {}; body[p[0]][p[1]] = v; } else body[p[0]] = v;
  });
  return body;
}
async function post(sub, body, msg) {
  const r = await run(() => api('POST', '/api/chat/' + cur.id + '/' + sub, body), msg);
  if (r && r.id) {
    cur = r;
    $('#pane').innerHTML = pane();
    if (tab === 'mitglieder') loadMembers(); else afterRender();
  }
  return r;
}

document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  if (act === 'logout') { await run(() => api('POST', '/api/logout')); me = null; showLogin(); }
  else if (act === 'home') run(showHome);
  else if (act === 'open') run(() => openChat(v));
  else if (act === 'cat') { const c = NAV.find((x) => x.id === v); tab = c.tabs.some((t) => t[0] === tab) ? tab : c.tabs[0][0]; if (catOf(tab).id !== v) tab = c.tabs[0][0]; renderChat(); }
  else if (act === 'tab') { tab = v; renderChat(); }
  else if (act === 'save') post('settings', collect(), 'Gespeichert');
  else if (act === 'lock') post('action', { type: 'lock' }, 'Gruppe gesperrt');
  else if (act === 'unlock') post('action', { type: 'unlock' }, 'Gruppe entsperrt');
  else if (act === 'preset') { if (confirm('Preset „' + v + '“ anwenden? Schalter und Limits werden überschrieben.')) post('preset', { name: v }, 'Preset angewendet'); }
  else if (act === 'copyfrom') { if (confirm('Einstellungen aus der gewählten Gruppe übernehmen? Die aktuellen werden überschrieben.')) post('copyfrom', { from: val('cfrom') }, 'Übernommen'); }
  else if (act === 'import') {
    let d; try { d = JSON.parse(val('impjson')); } catch (_) { return toast('Kein gültiges JSON', true); }
    if (confirm('Importierte Einstellungen überschreiben die aktuellen. Fortfahren?')) post('import', { data: d }, 'Importiert');
  }
  else if (act === 'gban') {
    const uid = val('gb-id').trim(); if (!uid) return toast('User-ID fehlt', true);
    if (confirm('User ' + uid + ' in ALLEN Gruppen bannen?')) { const r = await run(() => api('POST', '/api/gban', { userId: uid, reason: val('gb-reason') })); if (r) { toast('In ' + r.ok + ' Gruppen gebannt'); run(showHome); } }
  }
  else if (act === 'ungban') {
    if (confirm('Globalen Bann für ' + v + ' aufheben (in allen Gruppen entbannen)?')) { const r = await run(() => api('POST', '/api/ungban', { userId: v })); if (r) { toast('Entbannt'); run(showHome); } }
  }
  else if (act === 'restore') {
    if (confirm('Backup ' + v + ' wiederherstellen? Der aktuelle Stand wird vorher gesichert, alle Einstellungen werden ersetzt.')) { const r = await run(() => api('POST', '/api/restore', { name: v })); if (r) { toast('Wiederhergestellt (' + r.chats + ' Gruppen)'); run(showHome); } }
  }
  else if (act === 'revoke') { const r = await run(() => api('POST', '/api/sessions/revoke', { id: v })); if (r) run(showHome); }
  else if (act === 'forget') { if (confirm('Gruppe wirklich aus dem Bot entfernen? Alle Daten dieser Gruppe gehen verloren.')) { const r = await run(() => api('POST', '/api/chat/' + cur.id + '/forget'), 'Entfernt'); if (r) { groups = []; run(showHome); } } }
  else if (act === 'send') { await post('action', { type: 'send', text: val('sendtxt'), pin: $('#send-pin') && $('#send-pin').checked }, 'Gesendet'); }
  else if (act === 'broadcast') { if (!val('bc').trim()) return toast('Text fehlt', true); if (confirm('An alle Gruppen senden?')) { const r = await run(() => api('POST', '/api/broadcast', { text: val('bc') })); if (r) toast('Gesendet an ' + r.ok + '/' + r.total); } }
  else if (act === 'mopen') { mem.open = mem.open === v ? null : v; renderMembers(); }
  else if (act === 'mpage') { mem.page = Math.max(0, mem.page + Number(v)); loadMembers(); }
  else if (act === 'evf') { ev.f = v; $('#pane').innerHTML = pane(); renderEvents(); }
  else if (act === 'mnote') {
    const sc = el.closest('[data-scope]'); const inp = sc && sc.querySelector('[data-note]');
    post('action', { type: 'note', userId: sc ? sc.dataset.uid : '', text: inp ? inp.value : '' }, 'Notiz gespeichert');
  }
  else if (act === 'mod') {
    const sc = el.closest('[data-scope]');
    const uid = el.dataset.uid || (sc && (sc.dataset.uid || (sc.querySelector('[data-uidin]') || {}).value)) || '';
    const mi = sc && sc.querySelector('[data-min]');
    post('action', { type: v, userId: String(uid).trim(), minutes: mi ? mi.value : '' }, 'Erledigt');
  }
  else if (act.startsWith('add-')) {
    const l = act.slice(4);
    const b = { list: l, op: (l === 'notes' || l === 'triggers') ? 'set' : 'add' };
    if (l === 'domains' || l === 'words' || l === 'blockdomains') b.value = val('a-' + l);
    if (l === 'wbuttons') { b.text = val('wb-text'); b.url = val('wb-url'); }
    if (l === 'notes') { b.name = val('n-name'); b.text = val('n-text'); }
    if (l === 'triggers') { b.key = val('t-key'); b.text = val('t-text'); }
    if (l === 'schedules') { b.time = val('s-time'); b.text = val('s-text'); b.pin = $('#s-pin').checked; b.days = [...document.querySelectorAll('.sd:checked')].map((x) => Number(x.value)); }
    post('list', b, 'Gespeichert');
  }
  else if (act.startsWith('rm-')) {
    const l = act.slice(3);
    if (l === 'approved') return post('action', { type: 'unapprove', userId: v }, 'Entfernt');
    const b = { list: l, op: 'remove' };
    if (l === 'notes') b.name = v; else if (l === 'triggers') b.key = v; else if (l === 'schedules' || l === 'wbuttons') b.index = Number(v); else b.value = v;
    post('list', b, 'Entfernt');
  }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.id === 'gsel') run(() => openChat(el.value));
  else if (el.id === 'msort') { mem.sort = el.value; mem.page = 0; loadMembers(); }
  else if (el.dataset.lock) post('settings', { locks: { [el.dataset.lock]: el.checked } });
  else if (el.dataset.script) post('settings', { scripts: { [el.dataset.script]: el.checked } });
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'mq') { clearTimeout(memT); memT = setTimeout(() => { mem.q = e.target.value; mem.page = 0; loadMembers(); }, 300); }
});

init();
</script>
</body>
</html>
